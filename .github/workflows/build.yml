name: Build
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build (${{ matrix.os }}, java ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - ubuntu-24.04-arm
        java-version:
          - '17'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Check formatting
        # Formatting does not depend on the OS: check it only once
        if: runner.os == 'Linux'
        run: |
          pnpm install --frozen-lockfile --filter .
          pnpm run prettier:check
      - name: Setup Gradle
        # Caches the dependencies and the build cache of the Gradle plugin build, run by Maven
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: mvn --no-transfer-progress --batch-mode clean verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            liquibase-linter-gradle-plugin/build/reports/tests/
            liquibase-linter-gradle-plugin/build/test-results/
          retention-days: 7

  build-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install and Build
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  liquibase-compatibility:
    runs-on: ubuntu-latest
    needs: [build, build-website]
    strategy:
      matrix:
        liquibase-minor-version:
          - '4.33'
          - '5.0'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Setup semver tool
        run: npm install -g semver
      - name: Run Liquibase compatibility tests for liquibase version ${{ matrix.liquibase-minor-version }}
        run: >
          LIQUIBASE_NEXT_MINOR_VERSION=$(semver ${{ matrix.liquibase-minor-version }}.0 --increment minor);
          LIQUIBASE_VERSION_RANGE="[${{ matrix.liquibase-minor-version }}.0,${LIQUIBASE_NEXT_MINOR_VERSION})";
          echo "Liquibase version range: ${LIQUIBASE_VERSION_RANGE}";
          mvn clean verify --no-transfer-progress --batch-mode -Dliquibase.version="${LIQUIBASE_VERSION_RANGE}" -Dgradle.skip=true
  # Summary job that allows checking for workflow status
  # This job is used as a required status check to pass before merging to the main branch
  status-checks:
    name: status-checks
    needs: [liquibase-compatibility]
    permissions:
      contents: none
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - name: Validation Status checks
        run: |
          echo 'Configuration for Status checks that are required'
          echo '${{ toJSON(needs) }}'
          if [[ ('${{ needs.liquibase-compatibility.result }}' == 'success') ]]; then
            exit 0
          fi
          exit 1
